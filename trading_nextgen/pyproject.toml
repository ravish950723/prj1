[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-nextgen"
version = "0.1.0"
description = "ML + DL + Quant + EPS stock analysis pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Ravish Sinha" }
]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "openpyxl>=3.1",
  "requests>=2.31",
  "pyarrow>=15.0",
  "xgboost>=2.0",
  "torch>=2.0",
  "ib-insync>=0.9.86"
]

[project.scripts]
buypipe-run = "buypipe.cli:run_pipeline_cli"
buypipe-train = "buypipe.cli:train_models_cli"
buypipe-train-ml = "buypipe.cli:train_ml_cli"
buypipe-train-dl = "buypipe.cli:train_dl_cli"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["buypipe*"]

[tool.setuptools.package-data]
buypipe = []